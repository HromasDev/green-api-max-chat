# Git-хуки. Ставятся автоматически (`prepare` → lefthook) при `pnpm install`.

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
      stage_fixed: false

    lint:
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm exec oxlint {staged_files}

    format:
      glob: '*.{ts,tsx,js,jsx,json,css,md,html,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    test:
      run: pnpm test

    typecheck:
      run: pnpm typecheck
